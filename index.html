<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F2F8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="רצף">
<meta name="description" content="מעקב יעדים יומיים ושבועיים ואימוני חדר כושר">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>רצף</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F7BFF"/><stop offset="1" stop-color="#3FA9FF"/>
    </linearGradient>
  </defs>
</svg>

<main id="main"></main>
<div id="mini" hidden></div>

<nav id="tabs" aria-label="ניווט">
  <button data-act="tab" data-tab="today">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg>
    <span>יעדים</span>
  </button>
  <button data-act="tab" data-tab="cal">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>יומן</span>
  </button>
  <button data-act="tab" data-tab="gym">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
    <span>אימונים</span>
  </button>
</nav>

<div id="workout" hidden></div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/habits.js"></script>
<script src="js/gym.js"></script>
<script src="js/app.js"></script>
</body>
</html>
